name: CI

on:
  pull_request:
    branches: [main, dev, 'release/**']
  push:
    branches: [main, dev, 'release/**']

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    outputs:
      verify: ${{ steps.coverage.outputs.verify }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate branch and promotion target
        env:
          EVENT: ${{ github.event_name }}
          SOURCE: ${{ github.head_ref || github.ref_name }}
          TARGET: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            node scripts/check-delivery-policy.mjs pr "$SOURCE" "$TARGET"
          else
            node scripts/check-delivery-policy.mjs branch "$SOURCE"
          fi
      - name: Avoid duplicate release verification
        id: coverage
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SOURCE: ${{ github.head_ref || github.ref_name }}
        run: |
          verify=true
          if [ "$EVENT" = push ] && [[ "$SOURCE" == release/* ]]; then
            count=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
              -f "head=$GITHUB_REPOSITORY_OWNER:$SOURCE" -f state=open \
              --jq '[.[] | select(.base.ref == "main" or (.base.ref | startswith("release/")))] | length')
            if [ "$count" -gt 0 ]; then
              verify=false
              echo 'The open release PR owns full verification for this push.'
            fi
          fi
          printf 'verify=%s\n' "$verify" >> "$GITHUB_OUTPUT"
  checks:
    needs: policy
    if: needs.policy.outputs.verify == 'true'
    uses: ./.github/workflows/verify.yml
    with:
      source-ref: ${{ github.event.pull_request.head.sha || github.sha }}
      profile: ${{ (github.base_ref == 'dev' || github.ref == 'refs/heads/dev') && 'fast' || 'full' }}
  deploy-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.HOSTED_DEV_ENABLED == 'true'
    needs: checks
    uses: ./.github/workflows/deploy-vercel.yml
    with:
      target: dev
      source-sha: ${{ github.sha }}
      source-branch: dev
    secrets: inherit
