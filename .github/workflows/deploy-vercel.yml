name: Deploy verified Vercel build

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      source-sha:
        type: string
        required: true
      source-branch:
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    timeout-minutes: 20
    concurrency:
      group: vercel-${{ inputs.target }}
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION }}
      NITRO_PRESET: vercel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check source and required configuration
        env:
          SOURCE_BRANCH: ${{ inputs.source-branch }}
          DEPLOY_TARGET: ${{ inputs.target }}
        run: |
          node scripts/check-delivery-policy.mjs deploy "$SOURCE_BRANCH" "$DEPLOY_TARGET"
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          [[ "$VERCEL_CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Install pinned CLI
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      - name: Build and deploy to the selected Vercel environment
        env:
          DEPLOY_TARGET: ${{ inputs.target }}
          SOURCE_BRANCH: ${{ inputs.source-branch }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: bash scripts/deploy-vercel.sh
