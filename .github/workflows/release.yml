name: Deploy release

on:
  workflow_dispatch:
    inputs:
      release-branch:
        description: 'Release branch to deploy, for example release/0.1.0'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate release and pin its commit
        id: source
        env:
          RELEASE_BRANCH: ${{ inputs.release-branch }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          node scripts/check-delivery-policy.mjs deploy "$RELEASE_BRANCH" production
          git fetch origin refs/heads/main:refs/remotes/origin/main "refs/heads/$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH"
          source_sha=$(git rev-parse "refs/remotes/origin/$RELEASE_BRANCH")
          git merge-base --is-ancestor origin/main "$source_sha"
          printf 'sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
      - name: Require successful full CI for that exact release commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ inputs.release-branch }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: node scripts/find-release-verification.mjs
  deploy:
    needs: resolve
    uses: ./.github/workflows/deploy-vercel.yml
    with:
      target: production
      source-sha: ${{ needs.resolve.outputs.sha }}
      source-branch: ${{ inputs.release-branch }}
    secrets: inherit
